version: "3.9"
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATA_MODE=mock
      - DATABASE_URL=postgresql://weathergpt:weathergpt@db:5432/weathergpt
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
